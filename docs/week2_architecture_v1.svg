<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1480" viewBox="0 0 2040 1480" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">LearnPath V1 System Architecture</title>
<desc id="desc">A top-to-bottom architecture showing learner input, validation, resource retrieval from an approved catalogue, matching and ranking, an evidence check that leads either to a grounded explanation or a no-match response, the recommendation response to the learner, and evaluation and monitoring.</desc>
<defs>
  <marker id="arrow" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" refX="14" refY="8" orient="auto"><path d="M0 1 L15 8 L0 15 Z" fill="#52657a"/></marker>
  <marker id="greenArrow" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" refX="14" refY="8" orient="auto"><path d="M0 1 L15 8 L0 15 Z" fill="#21845b"/></marker>
  <marker id="redArrow" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" refX="14" refY="8" orient="auto"><path d="M0 1 L15 8 L0 15 Z" fill="#c25454"/></marker>
  <style>
    .title{font:700 46px Arial,sans-serif;fill:#172b45}
    .subtitle{font:23px Arial,sans-serif;fill:#5b6b7e}
    .section{font:700 16px Arial,sans-serif;fill:#5b6b7e;letter-spacing:2px}
    .step{font:700 16px Arial,sans-serif;fill:#fff}
    .heading{font:700 22px Arial,sans-serif;fill:#172b45}
    .body{font:18px Arial,sans-serif;fill:#526176}
    .small{font:16px Arial,sans-serif;fill:#526176}
    .label{font:700 17px Arial,sans-serif}
    .node{stroke-width:3}
    .line{fill:none;stroke:#52657a;stroke-width:4;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .yes{fill:none;stroke:#21845b;stroke-width:4;marker-end:url(#greenArrow);stroke-linecap:round;stroke-linejoin:round}
    .no{fill:none;stroke:#c25454;stroke-width:4;marker-end:url(#redArrow);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="2040" height="1480" fill="#f6f8fb"/>
<text x="80" y="90" class="title">LearnPath — V1 System Architecture</text>
<text x="82" y="134" class="subtitle">Evidence-based learning resource recommendations using Retrieval-Augmented Generation (RAG)</text>
<text x="80" y="212" class="section">1. LEARNER INPUT &amp; RESOURCE MATCHING</text>
<rect class="node" x="80" y="240" width="280" height="200" rx="20" fill="#eaf2ff" stroke="#4c79ad"/>
<circle cx="110" cy="272" r="17" fill="#4c79ad"/><text x="110" y="278" text-anchor="middle" class="step">1</text>
<text x="110" y="328" class="heading">Learner</text>
<text x="110" y="364" class="body">• Learning topic</text>
<text x="110" y="392" class="body">• Experience level</text>
<text x="110" y="420" class="body">• Learning goal</text>
<rect class="node" x="400" y="240" width="280" height="200" rx="20" fill="#fff" stroke="#4c79ad"/>
<circle cx="430" cy="272" r="17" fill="#4c79ad"/><text x="430" y="278" text-anchor="middle" class="step">2</text>
<text x="430" y="328" class="heading">Application UI</text>
<text x="430" y="364" class="body">Collects learner</text>
<text x="430" y="392" class="body">preferences and</text>
<text x="430" y="420" class="body">sends the request</text>
<rect class="node" x="720" y="240" width="280" height="200" rx="20" fill="#fff" stroke="#4c79ad"/>
<circle cx="750" cy="272" r="17" fill="#4c79ad"/><text x="750" y="278" text-anchor="middle" class="step">3</text>
<text x="750" y="328" class="heading">Input Validation</text>
<text x="750" y="364" class="body">Checks required</text>
<text x="750" y="392" class="body">fields and input</text>
<text x="750" y="420" class="body">format</text>
<rect class="node" x="1040" y="240" width="280" height="200" rx="20" fill="#fff" stroke="#4c79ad"/>
<circle cx="1070" cy="272" r="17" fill="#4c79ad"/><text x="1070" y="278" text-anchor="middle" class="step">4</text>
<text x="1070" y="328" class="heading">Resource Retrieval</text>
<text x="1070" y="364" class="body">Searches the</text>
<text x="1070" y="392" class="body">approved resource</text>
<text x="1070" y="420" class="body">catalogue</text>
<rect class="node" x="1360" y="240" width="280" height="200" rx="20" fill="#fff7e8" stroke="#c18a32"/>
<circle cx="1390" cy="272" r="17" fill="#b27b20"/><text x="1390" y="278" text-anchor="middle" class="step">5</text>
<text x="1390" y="328" class="heading">Matching &amp; Ranking</text>
<text x="1390" y="364" class="body">Scores resources</text>
<text x="1390" y="392" class="body">by topic, level</text>
<text x="1390" y="420" class="body">and learning goal</text>
<rect class="node" x="1680" y="240" width="280" height="200" rx="20" fill="#f2edff" stroke="#8665b5"/>
<circle cx="1710" cy="272" r="17" fill="#8665b5"/><text x="1710" y="278" text-anchor="middle" class="step">6</text>
<text x="1710" y="328" class="heading">Evidence Check</text>
<text x="1710" y="364" class="body">Is there enough</text>
<text x="1710" y="392" class="body">relevant evidence</text>
<text x="1710" y="420" class="body">to recommend?</text>
<path class="line" d="M360 340 H400"/><path class="line" d="M680 340 H720"/><path class="line" d="M1000 340 H1040"/><path class="line" d="M1320 340 H1360"/><path class="line" d="M1640 340 H1680"/>
<rect class="node" x="980.0" y="540" width="400" height="150" rx="20" fill="#fff7e8" stroke="#c18a32"/>
<text x="1010.0" y="592" class="heading">Approved Resource Catalogue</text>
<text x="1010.0" y="630" class="body">Curated free resources</text>
<text x="1010.0" y="658" class="body">Descriptions • metadata • URLs</text>
<path class="line" d="M1135.0 440 V540"/><text x="1118.0" y="495" text-anchor="end" class="small">Search</text>
<path class="line" d="M1225.0 540 V440"/><text x="1242.0" y="495" class="small">Retrieve</text>
<text x="80" y="752" class="section">2. EVIDENCE-BASED RESPONSE</text>
<path class="yes" d="M1740 440 V740 H700 V830"/><path class="no" d="M1900 440 V770 H1500 V830"/>
<rect x="1260.0" y="723" width="80" height="34" rx="17" fill="#e4f4eb"/><text x="1300" y="746" text-anchor="middle" class="label" fill="#21845b">YES</text>
<rect x="1615.0" y="753" width="70" height="34" rx="17" fill="#fdecec"/><text x="1650" y="776" text-anchor="middle" class="label" fill="#c25454">NO</text>
<rect class="node" x="440.0" y="830" width="520" height="170" rx="22" fill="#eaf7f0" stroke="#21845b"/>
<text x="470.0" y="885" class="heading">7A. Grounded AI Explanation</text>
<text x="470.0" y="930" class="body">Uses retrieved catalogue evidence only</text>
<text x="470.0" y="960" class="body">Explains why each resource is suitable</text>
<rect class="node" x="1250.0" y="830" width="500" height="170" rx="22" fill="#fff1f0" stroke="#c25454"/>
<text x="1280.0" y="885" class="heading">7B. No-Match Response</text>
<text x="1280.0" y="930" class="body">Used when evidence is missing or weak</text>
<text x="1280.0" y="960" class="body">Explains that no suitable match was found</text>
<path class="yes" d="M700 1000 V1050 H850.0 V1090"/><path class="no" d="M1500 1000 V1050 H1350.0 V1090"/>
<rect class="node" x="650.0" y="1090" width="900" height="140" rx="22" fill="#eaf2ff" stroke="#4c79ad"/>
<text x="690.0" y="1140" class="heading">8. Recommendation Response to Learner</text>
<text x="690.0" y="1180" class="body">Resource title • provider • source link • evidence-based explanation</text>
<text x="690.0" y="1210" class="small">Or a clear no-match message when there is insufficient evidence</text>
<path class="line" d="M1100.0 1230 V1270"/>
<rect class="node" x="520.0" y="1270" width="1160" height="120" rx="20" fill="#edf1f5" stroke="#718096"/>
<text x="560.0" y="1320" class="heading">9. Evaluation &amp; Monitoring</text>
<text x="560.0" y="1360" class="body">Recommendation relevance • source traceability • explanation grounding • response time • no-match handling</text>
<text x="80" y="1445" class="small">Conceptual V1 design. Specific models, frameworks and databases will be selected during implementation.</text>
</svg>

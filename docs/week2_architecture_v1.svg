.title{font: bold 48px Arial;fill:#14243a}.sub{font:23px Arial;fill:#526176}.h{font:bold 25px Arial;fill:#14243a}.p{font:18px Arial;fill:#526176}.edge{stroke:#526176;stroke-width:5;fill:none;marker-end:url(#arr)}.green{stroke:#4a9870}.red{stroke:#c46b61}
